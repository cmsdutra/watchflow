# ==============================================================================
# WatchFlow — Exemplo Canônico de Configuração
# ==============================================================================
# Versão do esquema de configuração (atualmente: 1)
version: 1

# Parâmetros gerais do daemon de segundo plano
daemon:
  # Diretório onde serão armazenados o banco SQLite (state.db) e logs
  state_dir: "~/.local/state/watchflow"

  # Caminho para o Unix Domain Socket de controle da CLI
  # ${UID} é expandido automaticamente para o UID do usuário corrente
  socket_path: "/run/user/${UID}/watchflow.sock"

  # Nível de detalhamento dos logs estruturados: debug, info, warn, error
  log_level: "info"

  # Quantidade máxima de pipelines executando em paralelo em repositórios distintos
  max_concurrent_pipelines: 2

# Configuração de alertas e notificações do sistema operacional
notifications:
  enabled: true
  on_success: false   # Evita notificações ruidosas em execuções normais
  on_error: true      # Alerta em erros de conexão ou falhas de step
  on_conflict: true   # Alerta desktop obrigatório se houver colisão de merge
  backend: "desktop"  # desktop (notify-send), log, webhook

  # Obrigatório apenas quando backend == "webhook".
  # Recebe um POST JSON com {kind, watcher, title, message, detail, timestamp}.
  # webhook_url: "https://exemplo.com/hooks/watchflow"

# Diretórios raízes vigiados pelo daemon
watchers:
  - name: "personal-vault"
    # Caminho absoluto ou com '~' para o diretório observado (ex.: cofre do Obsidian)
    path: "~/Chaos"
    enabled: true

    # Janela deslizante de silêncio para coalescer rajadas de escrita (trailing debounce)
    debounce: "15s"

    # Teto máximo absoluto de espera: força o despacho mesmo se houver escrita contínua
    max_wait: "60s"

    # De quanto em quanto tempo consultar o remoto mesmo sem alterações locais.
    # Sem isso, o que outra máquina publicar só chega quando você editar algo
    # aqui. A primeira consulta acontece logo após o daemon subir, e não depois
    # de um intervalo inteiro. Use "0" para desativar; o mínimo aceito é 30s.
    pull_interval: "5m"

    # Padrões glob de caminhos a serem descartados imediatamente (< 1ms)
    ignore:
      - ".git/**"
      - ".obsidian/cache/**"
      - ".obsidian/workspace*"
      - "**/*.tmp"
      - "**/.DS_Store"
      - ".tmp/**"

    # Pipelines a serem disparados quando houver lote consolidado de alterações
    pipelines:
      - "vault-git-sync"

# Declaração dos pipelines e seus passos sequenciais
pipelines:
  vault-git-sync:
    # Tempo limite máximo para conclusão de toda a sequência antes de abortar
    timeout: "120s"

    # Tentativas antes de a falha virar definitiva. Omitido = 5.
    # Falhas de rede recuam exponencialmente (5s*2^n, teto 300s); rejeições de
    # push por avanço do remoto usam espera curta (1s*2^n, teto 15s), já que
    # basta refazer o safe_sync para reconvergir.
    max_retries: 5

    # Passos executados linearmente (interrompe imediatamente se algum passo falhar)
    steps:
      # Step 1: Verifica e aguarda travas externas alheias (.git/index.lock).
      # O daemon JAMAIS remove uma trava de terceiros; apenas aguarda.
      - action: "git.check_locks"
        params:
          max_wait_lock: "10s"
          poll_interval: "200ms"

      # Step 2: Adiciona as modificações da árvore de trabalho.
      # all: true  -> git add -A (varre a árvore inteira)
      # all: false -> adiciona apenas os arquivos do lote que disparou o job
      - action: "git.add"
        params:
          all: true

      # Step 3: Cria o commit local. Sem alterações staged o step é pulado,
      # portanto nunca gera commits vazios (use allow_empty: true para forçar).
      # Placeholders: {timestamp} {iso_timestamp} {date} {time} {watcher} {files_count}
      - action: "git.commit"
        params:
          message: "watchflow: auto-sync {timestamp}"
          allow_empty: false

      # Step 4: Protocolo Safe Git Sync: fetch, inspeciona a divergência e aplica
      # fast-forward ou merge de 3 vias. Havendo conflito de linhas, executa
      # 'git merge --abort' imediatamente e interrompe o watcher.
      # Omita 'branch' para usar automaticamente o branch ativo do repositório.
      - action: "git.safe_sync"
        params:
          remote: "origin"

      # Step 5: Envia os commits para o remoto.
      # O número de tentativas e o backoff exponencial são propriedades do job na
      # fila (max_retries=5, backoff 5s*2^n até 300s), não deste step.
      - action: "git.push"
        params:
          remote: "origin"
