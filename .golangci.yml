run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - revive
    - misspell

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  revive:
    rules:
      - name: exported
        disabled: false
      - name: blank-imports
        disabled: false
      - name: context-as-argument
        disabled: false
      - name: dot-imports
        disabled: false
      - name: error-naming
        disabled: false
      - name: if-return
        disabled: false
      - name: var-naming
        disabled: false
  misspell:
    locale: US
    ignore-words:
      - comando
      - comandos
      - persistente
      - operacional
      - definitivo
      - exponencial
      - adquire
      - argumentos
      - supressão
      - supress
      - respondendo
      - momento
      - eles
      - dsn
      - contextos
      - informativo
      - alteracao
      - entrega
      - calcular
      - devolvendo
      - prestes
      - convers
      - independente
      - presentesão
      - convers
      - independente
      - presentes

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
